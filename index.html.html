<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Inteligente | Pedidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandGreen: '#10b981', 
                        brandDark: '#0f172a', 
                        brandCard: '#1e293b', 
                    }
                }
            }
        }
    </script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        /* Scrollbar estilizado para el textarea */
        textarea::-webkit-scrollbar { width: 6px; }
        textarea::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-brandDark text-gray-200 font-sans antialiased pb-48">

    <header class="bg-brandCard shadow-lg p-4 sticky top-0 z-50 border-b border-gray-700">
        <div class="max-w-3xl mx-auto flex justify-between items-start">
            <div>
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    <span class="text-brandGreen">Tortillería</span> Express
                </h1>
                <p class="text-sm text-gray-400 mt-1 flex items-center gap-1">
                    <svg class="w-4 h-4 text-brandGreen" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Av. Revolución 204, Centro (Frente al Kiosko)
                </p>
            </div>
            <div class="text-sm font-medium bg-brandDark px-3 py-1 rounded-full border border-brandGreen text-brandGreen whitespace-nowrap">
                🛵 Envío a Domicilio
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto p-4 mt-2">
        <h2 class="text-2xl font-bold mb-6 text-white border-l-4 border-brandGreen pl-3">Menú del Día</h2>
        
        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            </div>
    </main>

    <div id="floating-cart" class="fixed bottom-0 w-full bg-brandCard border-t border-brandGreen p-4 hidden shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.7)] z-50 fade-in">
        <div class="max-w-3xl mx-auto">
            
            <div class="mb-4">
                <label for="direccion-cliente" class="block text-sm font-medium text-gray-300 mb-1">📍 ¿A dónde lo enviamos?</label>
                <textarea id="direccion-cliente" rows="2" class="w-full bg-brandDark text-white border border-gray-600 rounded-lg p-2 text-sm focus:ring-2 focus:ring-brandGreen focus:border-transparent outline-none transition-all" placeholder="Ej. Calle Morelos #123, portón negro. Referencia: Esquina con la farmacia."></textarea>
            </div>

            <div class="flex justify-between items-center">
                <div>
                    <p class="text-sm text-gray-400">Total del pedido:</p>
                    <p class="text-2xl font-bold text-white">$<span id="cart-total">0.00</span></p>
                </div>
                <button onclick="enviarPedido()" class="bg-brandGreen hover:bg-green-500 text-white font-bold py-3 px-6 rounded-lg flex items-center shadow-lg transition-transform transform hover:scale-105">
                    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.347-.272.297-1.04 1.016-1.04 2.479 0 1.463 1.065 2.876 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                    Pedir
                </button>
            </div>
        </div>
    </div>

    <script>
        const WHATSAPP_NUMBER = "5214776772422"; 
        
        // Tus imágenes directas (Riesgo de Hotlinking a evaluar en producción)
        const productos = [
            { id: 1, nombre: "Kilo de Tortilla Blanca", descripcion: "Calientita, envuelta en papel grado alimenticio.", precio: 22.00, imagen: "https://cloudfront-us-east-1.images.arcpublishing.com/elfinanciero/DC72RKESDJATTGSDL4BFED5AMU.jpeg?auto=format&fit=crop&w=300&q=80" },
            { id: 2, nombre: "Kilo de Masa", descripcion: "Masa 100% de maíz nixtamalizado, ideal para tamales o sopes.", precio: 18.00, imagen: "https://yucatanalamano.com/wp-content/uploads/2024/10/images-37.jpeg?auto=format&fit=crop&w=300&q=80" },
            { id: 3, nombre: "Totopos (500g)", descripcion: "Crujientes, doraditos, perfectos para chilaquiles o botana.", precio: 35.00, imagen: "https://images.unsplash.com/photo-1513456852971-30c0b8199d4d?auto=format&fit=crop&w=300&q=80" },
            { id: 4, nombre: "Salsa Verde Martajada", descripcion: "Picor medio, receta de la casa con tomate verde y jalapeño.", precio: 25.00, imagen: "https://assets.tmecosys.com/image/upload/t_web_rdp_recipe_584x480/img/recipe/ras/Assets/F825E9CA-1EB5-48A9-9FFB-E60E985C805D/Derivates/12D61D0A-2259-494C-90B2-140677DC8B1B.jpg?auto=format&fit=crop&w=300&q=80" }
        ];

        let carrito = {};

        function renderProductos() {
            const grid = document.getElementById('product-grid');
            let html = '';

            productos.forEach(prod => {
                html += `
                    <div class="bg-brandCard p-3 rounded-xl border border-gray-700 shadow-md flex gap-4 items-center transition-colors hover:border-gray-500">
                        <img src="${prod.imagen}" alt="${prod.nombre}" class="w-24 h-24 object-cover rounded-lg shadow-sm border border-gray-600 flex-shrink-0">
                        
                        <div class="flex-1 min-w-0">
                            <h3 class="text-base sm:text-lg font-bold text-white truncate">${prod.nombre}</h3>
                            <p class="text-xs text-gray-400 mt-1 line-clamp-2">${prod.descripcion}</p>
                            <p class="text-brandGreen font-bold mt-1">$${prod.precio.toFixed(2)}</p>
                        </div>

                        <div class="flex flex-col items-center bg-brandDark rounded-lg p-1 border border-gray-700 flex-shrink-0">
                            <button onclick="modificarCantidad(${prod.id}, 1)" class="w-8 h-8 flex justify-center items-center text-brandGreen hover:text-white hover:bg-gray-700 rounded-md bg-brandCard font-bold mb-1 transition-colors">+</button>
                            <span id="qty-${prod.id}" class="w-8 text-center font-bold text-white text-sm my-1">0</span>
                            <button onclick="modificarCantidad(${prod.id}, -1)" class="w-8 h-8 flex justify-center items-center text-gray-400 hover:text-white hover:bg-gray-700 rounded-md bg-brandCard font-bold mt-1 transition-colors">-</button>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function modificarCantidad(id, cambio) {
            if (!carrito[id]) carrito[id] = 0;
            carrito[id] += cambio;
            if (carrito[id] < 0) carrito[id] = 0; 
            
            document.getElementById(`qty-${id}`).innerText = carrito[id];
            actualizarCarritoUI();
        }

        function actualizarCarritoUI() {
            let total = 0;
            let items = 0;

            productos.forEach(prod => {
                if (carrito[prod.id] > 0) {
                    total += carrito[prod.id] * prod.precio;
                    items += carrito[prod.id];
                }
            });

            document.getElementById('cart-total').innerText = total.toFixed(2);

            const floatingCart = document.getElementById('floating-cart');
            if (items > 0) {
                floatingCart.classList.remove('hidden');
            } else {
                floatingCart.classList.add('hidden');
            }
        }

        function enviarPedido() {
            const direccionInput = document.getElementById('direccion-cliente').value.trim();
            
            // Validación: Obligar al cliente a poner su dirección
            if (direccionInput === "") {
                alert("Por favor, ingresa tu dirección de entrega antes de pedir.");
                document.getElementById('direccion-cliente').focus();
                return;
            }

            let total = 0;
            let mensaje = "👋 Hola! Quiero hacer un pedido a domicilio:\n\n";

            productos.forEach(prod => {
                if (carrito[prod.id] > 0) {
                    let subtotal = carrito[prod.id] * prod.precio;
                    mensaje += `▪ ${carrito[prod.id]}x ${prod.nombre} ($${subtotal.toFixed(2)})\n`;
                    total += subtotal;
                }
            });

            mensaje += `\n*TOTAL DEL PEDIDO: $${total.toFixed(2)}*\n\n`;
            mensaje += `📍 *Dirección de entrega:* \n${direccionInput}`;

            const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }

        renderProductos();
    </script>
</body>
</html>
